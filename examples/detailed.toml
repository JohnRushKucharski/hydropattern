# Comprehensive configuration for current source code / the next release.
# PyPI v0.2.0 does not support these ordered tables with "parameters".
# Thresholds illustrate software behavior, not universal ecological criteria.
#
# Open a terminal in the repository root:
#   uv run hydropattern run examples\detailed.toml --no-excel
# Input paths resolve from that working folder, not this file's folder.
# See docs/user/examples/index.md for small downloadable example packs.
# Exact field reference: docs/user/reference/configuration.md
# Scientific background: https://doi.org/10.2307/1313099
# Functional flows: https://doi.org/10.1002/rra.3575

# Input: "time" followed by one or more numeric scenario columns.
[timeseries]
path = "examples/single_timeseries.csv"
date_format = "%Y-%m-%d"       # Omit to infer the input date format.
# first_day_of_water_year = 1 # Default: January 1; 274 means October 1.
# sheet_name = 0              # First Excel sheet; ignored for CSV input.
# Water-year boundaries use a 365-day calendar scale, in the range 1-365.
# February 28 and 29 share a seasonal label; see the timing reference.

# Ordered tables explicitly fix evaluation order. Timing, magnitude, and
# rate of change are independent diagnostics. Duration and frequency assess
# the combined conditions of all preceding characteristics.
# Compact syntax remains supported; do not mix it with ordered tables.

# November pulse: inclusive season, flow threshold, and rising-flow ratio.
[components.november_pulse_flow]
success_pattern = true

[[components.november_pulse_flow.characteristics]]
type = "timing"
parameters = [305, 335]       # November 1 through December 1, inclusive.

[[components.november_pulse_flow.characteristics]]
type = "magnitude"
parameters = [">", 1.0]      # Flow units are the same as the input.

[[components.november_pulse_flow.characteristics]]
type = "rate_of_change"
parameters = [">", 2.0, 1]   # Unsmoothed current / previous flow > 2.

# Failure pattern: non-failure is not proof of ecological benefit.
[components.dry_season_baseflow]
success_pattern = false

[[components.dry_season_baseflow.characteristics]]
type = "timing"
parameters = [152, 305]       # June 1 through November 1, inclusive.

[[components.dry_season_baseflow.characteristics]]
type = "magnitude"
parameters = ["<", 1.0]

[[components.dry_season_baseflow.characteristics]]
type = "duration"
parameters = [">", 7]        # Accept entire qualifying runs longer than 7.
# Whole-run assessment marks the entire run, not only timesteps after 7.
# Inclusive bounds such as [3, 7] accept whole runs of length 3 through 7.

# Un-nested frequency counts qualifying timesteps, not component events.
[components.bankfull_flow]

[[components.bankfull_flow.characteristics]]
type = "magnitude"
parameters = [">", 2.0]

[[components.bankfull_flow.characteristics]]
type = "frequency"
parameters = [">=", 1, 5]     # At least one qualifying timestep in a window.
# Windows look forward from qualifying anchors; overlap is combined.
# A final true flag selects exclusive windows: [">=", 1, 5, true].
# Record-end windows are assessed using the observations still available.
# Terminal frequency determines the final component outcome, including
# covered timesteps where the preceding magnitude condition is not met.

# Optional output settings (defaults remain active while commented out).
# [output]
# directory = "examples/output" # Default: "<config_stem>_output".
# excel = true                  # --no-excel selects raw CSV instead.
# overwrite = true              # False retains numbered alternatives.
# Component summary workbooks are written even when raw results use CSV.
#
# [output.metric]
# mode = "portion"              # Use portion or percentage for next release.
# The legacy return_period mode is scheduled for removal, not redefined
# as a hydrologic recurrence interval. See docs/user/migration.md.
#
# [output.plot]
# enabled = false               # This file's input is not a scenario grid.
# Plotting requires scenario names such as "_0_1.5": precipitation delta
# first, temperature delta second. See docs/user/guide/plotting.md.
#
# [output.plot.climate-canvas]
# interpolate = true
# fillin = false
# show = false
# title = "Response Surface"    # Default: component name.
# xlabel = "Precipitation Delta (%)"
# ylabel = "Temperature Delta (C)"
# zlabel = "portion"            # Default: configured summary mode.
# threshold = 0.5               # Default: plotted range midpoint.
# color_map = "RdBu"
# color_map_ticks = [0.0, 0.5, 1.0]

# Further characteristic syntax (substitute parameters in ordered tables):
# - Timing: [first_day, last_day], inclusive; reversed bounds cross year end.
# - Magnitude: [operator, threshold, optional_ma_periods].
# - Rate of change: [operator, threshold, optional_ma_periods,
#                   optional_look_back, optional_min].
#   Compares current / lagged flow after optional smoothing; lagged flow
#   must be strictly above min (default 0). This is not a subtraction.
# - Duration: [operator, timestep_count] or inclusive [minimum, maximum].
# - Frequency: [operator, count, window_length, optional_exclusive_windows]
#   or [minimum_count, maximum_count, window_length, optional_flag].
# - Nested frequency: [[intra-annual pattern], [interannual pattern]].
#   For example [[">=", 0.5], [">=", 1, 2]] tests a qualifying fraction
#   within each complete water year, then counts qualifying water years
#   in two-water-year windows. See the frequency reference for details.
# All comparisons accept <, <=, >, >=, =, != where valid for the condition.
# Characteristic parameters are not summary metrics.
# See docs/user/reference/characteristics/ for defaults and restrictions.
# Unknown-outcome/reporting changes are deferred to their implementation;
# this configuration does not claim those future rules are already active.